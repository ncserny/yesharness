name: Bump version on merge

# Every merged pull request into main bumps the version by 0.1 (0.2.0 -> 0.3.0, 0.9.0 -> 1.0.0),
# commits and tags it (v0.3.0, ...), then publishes a GitHub release with the macOS app.
# Add the label "no-bump" to a PR to skip.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# No concurrency group: GitHub keeps only one waiting run per group and cancels the others, which
# dropped a merge's version once. Instead, each run retries on top of the latest main (below).

jobs:
  bump:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-bump')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Bump by 0.1, commit, tag and push (retries if another merge got there first)
        id: bump
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main --tags
            git reset -q --hard origin/main
            VERSION=$(python3 scripts/bump_version.py)
            git commit -qam "Version $VERSION (after PR #$PR)"
            git tag -a "v$VERSION" -m "YesHarness $VERSION"
            # Atomic: the tag only lands together with the commit.
            if git push --atomic origin HEAD:main "v$VERSION"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -d "v$VERSION"
            sleep $((attempt * 7))
          done
          echo "Couldn't push the version bump" >&2
          exit 1

  release:
    needs: bump
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build the app
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          bash scripts/bundle.sh
          codesign --verify --deep --strict dist/YesHarness.app
          ditto -c -k --sequesterRsrc --keepParent dist/YesHarness.app "dist/YesHarness-${{ needs.bump.outputs.version }}-macos-arm64.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "**$TITLE** (#$PR)"
            echo
            echo "Download \`YesHarness-$VERSION-macos-arm64.zip\`, unzip it and move YesHarness to Applications (Apple Silicon, macOS 14 or newer)."
            echo "It's not notarized: the first time, right-click the app and choose Open."
          } > notes.md
          gh release create "v$VERSION" "dist/YesHarness-$VERSION-macos-arm64.zip" \
            --title "YesHarness $VERSION" --notes-file notes.md --generate-notes --verify-tag
