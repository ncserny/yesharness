name: Bump version on merge

# Every merged pull request into main gets the next version (+0.1: v1.4.0 -> v1.5.0, v1.9.0 -> v2.0.0) as a
# git tag on its merge commit, and a GitHub release with the macOS app built from that tag. The version
# lives in the tags, so nothing is pushed to main: it works with main protected (pull requests only).
# Add the label "no-bump" to a PR to skip.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-bump')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Tag the merge with the next version (retries if another merge took it first)
        id: tag
        env:
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q --tags --force origin
            LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            VERSION=$(python3 scripts/bump_version.py --next "${LATEST:-v0.0.0}")
            git tag -a "v$VERSION" "$SHA" -m "YesHarness $VERSION: $TITLE (#$PR)"
            if git push origin "v$VERSION"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -d "v$VERSION"
            sleep $((attempt * 7))
          done
          echo "Couldn't push a version tag" >&2
          exit 1

  release:
    needs: bump
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build the app
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          YH_VERSION: ${{ needs.bump.outputs.version }}
        run: |
          bash scripts/bundle.sh
          codesign --verify --deep --strict dist/YesHarness.app
          ditto -c -k --sequesterRsrc --keepParent dist/YesHarness.app "dist/YesHarness-${{ needs.bump.outputs.version }}-macos-arm64.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "**$TITLE** (#$PR)"
            echo
            echo "Download \`YesHarness-$VERSION-macos-arm64.zip\`, unzip it and move YesHarness to Applications (Apple Silicon, macOS 14 or newer)."
            echo "It's not notarized: the first time, right-click the app and choose Open."
          } > notes.md
          gh release create "v$VERSION" "dist/YesHarness-$VERSION-macos-arm64.zip" \
            --title "YesHarness $VERSION" --notes-file notes.md --generate-notes --verify-tag
