name: Bump version on merge

# Every merged pull request into main bumps the version by 0.1 (0.2.0 -> 0.3.0, 0.9.0 -> 1.0.0),
# commits it and tags it (v0.3.0, ...). Add the label "no-bump" to a PR to skip.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-bump')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Bump version by 0.1
        id: bump
        run: echo "version=$(python3 scripts/bump_version.py)" >> "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $VERSION (after PR #$PR)"
          git tag -a "v$VERSION" -m "YesHarness $VERSION"
          git push origin HEAD:main "v$VERSION"
