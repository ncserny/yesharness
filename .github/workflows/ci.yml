name: Native builds and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libwayland-dev libgl1-mesa-dev
      - name: Install declared minimum Rust version
        run: rustup toolchain install 1.86.0 --profile minimal
      - name: Test with locked dependencies
        run: cargo +1.86.0 test --locked --all-targets
      - name: Build native release
        run: cargo +1.86.0 build --locked --release
      - name: Build and verify macOS bundle
        if: runner.os == 'macOS'
        env:
          RUSTUP_TOOLCHAIN: 1.86.0
        run: |
          bash scripts/bundle.sh
          codesign --verify --deep --strict dist/YesHarness.app
          ditto -c -k --sequesterRsrc --keepParent dist/YesHarness.app dist/YesHarness-macos.zip
      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/YesHarness-linux.tar.gz -C target/release yesharness
      - name: Upload macOS development bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: YesHarness-macos-arm64
          path: dist/YesHarness-macos.zip
          if-no-files-found: error
      - name: Upload Linux development binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: YesHarness-linux-x64
          path: dist/YesHarness-linux.tar.gz
          if-no-files-found: error
      - name: Upload Windows development binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: YesHarness-windows-x64
          path: target/release/yesharness.exe
          if-no-files-found: error
