[package]
name = "yesharness"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "Chat with your local AI agents (Claude Code, Codex, ...) in project channels."

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
global-hotkey = "0.10.0"

[profile.release]
opt-level = 3
strip = true
