[package]
name = "yesharness"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
description = "Chat with your local AI agents (Claude Code, Codex, ...) in project channels."

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
global-hotkey = "0.10.0"
egui_extras = { version = "0.31", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fastembed = { version = "6.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }

[profile.release]
opt-level = 3
strip = true
